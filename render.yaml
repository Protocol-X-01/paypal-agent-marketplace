# Render Blueprint for the PayPal Markets companion.
# Leaving the plan unspecified preserves an existing service's plan on sync.
# A new web service defaults to paid 0.5c-512mb; review charges before creation.
# Before linking or syncing, review the actual service and every field below:
# omitted buildFilter clears existing filters, omitted Blueprint previews are
# disabled, and explicit settings can change auto-deploy and environment values.
services:
  - type: web
    name: paypal-markets-companion
    runtime: node
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYPAL_ENV
        value: sandbox
      - key: CHANNEL3_BASE_URL
        value: https://api.trychannel3.com
      - key: CHANNEL3_COUNTRY
        value: US
      - key: CHANNEL3_CURRENCY
        value: USD
      - key: CHANNEL3_LANGUAGE
        value: en
      # Public catalog identifier; uses the separately created shared collection.
      - key: CHANNEL3_COLLECTION_ID
        value: 01M6RXV6KZC4ZPRAE6SNQ6EB96
      # Sign-in awaits its separate database, provider and device acceptance.
      - key: PAYPAL_LOGIN_ENABLED
        value: "false"
      - key: PAYPAL_NATIVE_LOGIN_ENABLED
        value: "false"
      - key: CHANNEL3_API_KEY
        sync: false
      # Production Channel3 calls fail closed until a reviewed budget connection and limits are configured.
      - key: CHANNEL3_BUDGET_DATABASE_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: NEXT_PUBLIC_AG_GRID_LICENSE
        sync: false
      - key: COINGECKO_DEMO_API_KEY
        sync: false
      # This template defaults to no export. Enabling it or changing an
      # existing service requires separate review and authorization.
      - key: PAYPAL_ELASTIC_EXPORT_ENABLED
        value: "false"
      # Secret prompts apply only to new Blueprint creations. Add values
      # manually to existing services because later syncs ignore sync:false.
      - key: ELASTIC_OTLP_ENDPOINT
        sync: false
      - key: PAYPAL_ELASTIC_OTLP_API_KEY
        sync: false
