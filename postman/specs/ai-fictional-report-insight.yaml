openapi: 3.1.0
info:
  title: PayPal Management Local Fictional Report Insight
  version: 0.1.0
  description: >-
    Local demonstration only. Summarizes the management concept's fixed,
    invented aggregate fixture. It does not use real staff identity, customer
    records, imports, a company feed, or payment data. OpenAI response storage
    is disabled. No caller-provided prompt or numbers are accepted.
servers:
  - url: http://127.0.0.1:9
paths:
  /api/ai/report-insight:
    post:
      operationId: summarizeFictionalReport
      summary: Summarize a selected fictional reporting fixture
      description: >-
        Requires an explicitly enabled local development service, exact
        canonical loopback Origin and Host, and a shared local attempt budget.
        The service must itself be bound to loopback without an external proxy;
        header checks are not authentication. The generated description may be
        inaccurate and cannot establish staff access, a live business condition,
        or payment authority. No automatic provider retries occur.
      parameters:
        - name: Origin
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [days, account, market]
              properties:
                days: { type: integer, enum: [7, 30] }
                account: { type: string, enum: [All, Personal, Business] }
                market: { type: string, enum: [All, US, UK, Other] }
      responses:
        '200':
          description: Generated explanation and independently calculated fictional aggregates.
          headers:
            Cache-Control: { required: true, schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [kind, generatedAt, model, insight, source, disclaimer]
                properties:
                  kind: { const: fictional-report }
                  generatedAt: { type: string, format: date-time }
                  model: { type: string }
                  disclaimer: { type: string }
                  insight: { $ref: '#/components/schemas/Insight' }
                  source:
                    type: object
                    additionalProperties: false
                    required: [provider, days, account, market, fixtureTimestamp, currentStart, currentEnd, priorStart, priorEnd, cohortCount, priorActive, currentActive, retained, currentAttempted, currentCompleted, priorCompleted, retention, completion]
                    properties:
                      provider: { const: Fictional local fixture }
                      days: { type: integer }
                      account: { type: string }
                      market: { type: string }
                      fixtureTimestamp: { type: string, format: date-time }
                      currentStart: { type: string, format: date-time }
                      currentEnd: { type: string, format: date-time }
                      priorStart: { type: string, format: date-time }
                      priorEnd: { type: string, format: date-time }
                      cohortCount: { type: integer }
                      priorActive: { type: integer }
                      currentActive: { type: integer }
                      retained: { type: integer }
                      currentAttempted: { type: integer }
                      currentCompleted: { type: integer }
                      priorCompleted: { type: integer }
                      retention: { type: [number, 'null'] }
                      completion: { type: [number, 'null'] }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '429':
          description: Shared local attempt budget or concurrency limit reached.
          headers:
            Retry-After: { schema: { type: string } }
            Cache-Control: { required: true, schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        '504': { $ref: '#/components/responses/Error' }
components:
  schemas:
    Insight:
      type: object
      additionalProperties: false
      required: [headline, summary, observations, caution]
      properties:
        headline: { type: string, minLength: 1, maxLength: 120 }
        summary: { type: string, minLength: 1, maxLength: 500 }
        observations: { type: array, minItems: 1, maxItems: 3, items: { type: string, minLength: 1, maxLength: 300 } }
        caution: { type: string, minLength: 1, maxLength: 300 }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
  responses:
    Error:
      description: Request rejected, provider unavailable, invalid provider response, or deadline exceeded. Raw upstream details are never exposed.
      headers:
        Cache-Control: { required: true, schema: { type: string, const: no-store } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
