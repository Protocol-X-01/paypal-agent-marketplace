openapi: 3.1.0
info:
  title: PayPal Agent Marketplace Market Data API
  version: 0.6.1
  description: >-
    Public crypto market metrics and chart data for the mobile marketplace
    experience. Provider credentials remain on the server. These endpoints do
    not expose wallet balances or execute transactions. Cross-origin browser
    requests are restricted to exact origins in MOBILE_WEB_ORIGINS; local Expo
    origins are allowed only outside production. Credentialed CORS is disabled.
servers:
  - url: /
paths:
  /api/health:
    get:
      operationId: getServiceHealth
      summary: Check application availability
      description: >-
        Returns liveness for the web process only. It does not verify provider
        credentials, market data freshness, PayPal webhook readiness, or storage.
      responses:
        "200":
          description: Application process is responding
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /api/market/coins:
    get:
      operationId: listMarketCoins
      summary: List tracked crypto market metrics
      description: >-
        Returns the configured market watchlist with provider timestamps. The
        current contract permits the tracked Bitcoin, Ethereum, Solana,
        Chainlink, Litecoin, Bitcoin Cash, and PayPal USD assets and reports
        USD market values. PayPal USD (PYUSD) is a separate USD-pegged
        stablecoin asset; it is not the USD quote currency. CoinGecko Demo
        credentials are required. Provider calls are capped at 24 per rolling
        60-second window per application process, below the 30-call/minute Demo
        limit; this budget is not shared across service instances. The app
        also caps requests at 12 per rolling 60 seconds per detected client
        address across CoinGecko-backed market routes. This request limit is
        process-local. The app
        accepts up to 2 MiB of decoded provider quote data; this is an
        application safeguard, not a CoinGecko size guarantee. A declared
        Content-Length above the limit is rejected even when encoded.
      responses:
        "200":
          description: Market metrics for tracked coins
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketOverview"
        "403":
          description: Request origin is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The Demo credential is missing or the upstream provider is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: The per-client request budget, per-process provider budget, or upstream provider rate limit was reached
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: string
                pattern: "^[0-9]+$"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The upstream market provider returned an invalid or oversized response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    options:
      operationId: preflightMarketCoins
      summary: Check whether the mobile web client may read USD market data
      responses:
        "204":
          $ref: "#/components/responses/MarketPreflightAllowed"
        "403":
          $ref: "#/components/responses/MarketPreflightDenied"
  /api/market/quotes:
    get:
      operationId: listMarketQuotes
      summary: List tracked crypto metrics in a display currency
      description: >-
        Returns CoinGecko market reference values in the requested fiat
        currency. Currency preferences are held by the client; no account,
        wallet, payment, or settlement currency is changed. The existing
        USD-only /api/market/coins response remains available for older clients.
        Provider calls share the same per-process Demo rate budget as the
        other market endpoints. Requests share the 12-per-60-second per-client
        budget across CoinGecko-backed routes. The app accepts up to 2 MiB of decoded provider
        quote data; this is an application safeguard, not a provider guarantee.
        A declared Content-Length above the limit is rejected even when encoded.
      parameters:
        - name: currency
          in: query
          required: false
          description: Uppercase display-currency code. Defaults to USD when omitted.
          schema:
            $ref: "#/components/schemas/MarketCurrency"
            default: USD
      responses:
        "200":
          description: Market reference values in the requested currency
          headers:
            Vary:
              description: The response varies by request origin.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketQuotes"
        "400":
          description: Unsupported display currency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Request origin is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: The per-client request budget, per-process provider budget, or upstream provider rate limit was reached
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: string
                pattern: "^[0-9]+$"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The upstream market provider returned an invalid or oversized response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The Demo credential is missing or the upstream provider is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    options:
      operationId: preflightMarketQuotes
      summary: Check whether the mobile web client may read currency quotes
      responses:
        "204":
          $ref: "#/components/responses/MarketPreflightAllowed"
        "403":
          $ref: "#/components/responses/MarketPreflightDenied"
  /api/market/chart/{coinId}:
    get:
      operationId: getMarketChart
      summary: Get price, market-cap, and volume history
      description: >-
        Returns CoinGecko's historical price, market-cap, and volume series.
        If the historical endpoint is rate-limited, 1-day and 7-day requests
        can fall back to the cached 7-day market sparkline. In that response,
        `seriesSource` and `availableMetrics` identify the price-only fallback.
        CoinGecko does not provide timestamps with these sparkline values, so
        fallback sample times are spread approximately evenly across the 7-day
        window and rounded to whole milliseconds. The app accepts up to 4 MiB
        of decoded provider chart data; fallback quotes use a separate 2 MiB
        limit. These are application safeguards, not provider guarantees; a
        declared Content-Length above the limit is rejected even when encoded.
        CoinGecko Demo credentials are required. Provider calls are capped at
        24 per rolling 60-second window per application process, below the
        30-call/minute Demo limit; this budget is not shared across instances.
        Requests share the 12-per-60-second per-client budget across
        CoinGecko-backed market routes. This request limit is process-local.
      parameters:
        - name: coinId
          in: path
          required: true
          description: CoinGecko identifier from the tracked watchlist
          schema:
            type: string
            enum: [bitcoin, ethereum, solana, chainlink, litecoin, bitcoin-cash, paypal-usd]
        - name: days
          in: query
          required: false
          description: Number of days of history to return
          schema:
            type: integer
            enum: [1, 7, 30, 90, 365]
            default: 7
        - name: currency
          in: query
          required: false
          description: Uppercase display-currency code. Defaults to USD when omitted.
          schema:
            $ref: "#/components/schemas/MarketCurrency"
            default: USD
      responses:
        "200":
          description: Historical market series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketChart"
        "400":
          description: Unsupported coin, time range, or display currency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Request origin is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The Demo credential is missing or the upstream provider is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: The per-client request budget, per-process provider budget, or upstream provider rate limit was reached
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: string
                pattern: "^[0-9]+$"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The upstream market provider returned an invalid or oversized response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    options:
      operationId: preflightMarketChart
      summary: Check whether the mobile web client may read chart data
      parameters:
        - name: coinId
          in: path
          required: true
          description: CoinGecko identifier from the tracked watchlist
          schema:
            type: string
            enum: [bitcoin, ethereum, solana, chainlink, litecoin, bitcoin-cash, paypal-usd]
      responses:
        "204":
          $ref: "#/components/responses/MarketPreflightAllowed"
        "403":
          $ref: "#/components/responses/MarketPreflightDenied"
  /api/market/candles/{coinId}:
    get:
      operationId: getMarketCandles
      summary: Get recorded OHLC candles
      description: >-
        Returns CoinGecko Demo OHLC candles without deriving candles from line
        samples. Timestamps identify candle close times. Demo auto-granularity
        is 30 minutes for 1 day, 240 minutes for 7 or 30 days, and 5760 minutes
        for 90 or 365 days. Missing candles are not filled. Indicators must use
        the returned closes and describe periods as candle counts. Only days
        and currency are accepted as query parameters, once each. The shared
        per-process provider budget is 24 calls per rolling 60 seconds.
        Requests share the 12-per-60-second per-client budget across
        CoinGecko-backed market routes. This request limit is process-local.
        Upstream JSON is limited to 1048576 decoded bytes, 1000 candles and an
        eight-second request/body deadline. No prices or candles are invented
        when credentials, provider access or validation fail.
      parameters:
        - name: coinId
          in: path
          required: true
          schema:
            type: string
            enum: [bitcoin, ethereum, solana, chainlink, litecoin, bitcoin-cash, paypal-usd]
        - name: days
          in: query
          schema:
            type: integer
            enum: [1, 7, 30, 90, 365]
            default: 7
        - name: currency
          in: query
          schema:
            $ref: "#/components/schemas/MarketCurrency"
            default: USD
      responses:
        "200":
          description: Recorded candles; an empty array means no candle history was returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketCandles"
        "400":
          description: Unsupported asset, range, currency, or unknown or repeated query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Request origin is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Per-client request budget, shared provider budget, or provider rate limit reached
          headers:
            Retry-After:
              schema:
                type: string
                pattern: "^[0-9]+$"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Oversized, malformed or invalid upstream candle data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Demo credentials missing, provider unavailable, or request/body deadline reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    options:
      operationId: preflightMarketCandles
      summary: Check mobile web access to candle history
      parameters:
        - name: coinId
          in: path
          required: true
          schema:
            type: string
            enum: [bitcoin, ethereum, solana, chainlink, litecoin, bitcoin-cash, paypal-usd]
      responses:
        "204":
          $ref: "#/components/responses/MarketPreflightAllowed"
        "403":
          $ref: "#/components/responses/MarketPreflightDenied"
  /api/marketplace/search:
    post:
      operationId: searchMarketplaceProducts
      summary: Search live marketplace products and offers
      description: >-
        Searches Channel3 after an explicit user action. The Channel3 key stays
        on the server; this endpoint returns catalog products and retailer links
        without creating a checkout or payment. Browser requests that include an
        Origin header must match the service host or an exact configured
        MOBILE_WEB_ORIGINS entry; local Expo origins are allowed only outside
        production. Native clients may omit Origin. Credentialed CORS is disabled.
        The request body is limited to 8192 bytes
        (8 KiB) and must finish streaming within 3 seconds. Oversized and timed-out
        bodies are rejected before JSON parsing. Search and catalog requests share
        a limit of eight requests per rolling 60 seconds per detected client
        address. At most two search bodies per detected address and eight per
        Node process can be read and validated at once;
        requests beyond that capacity receive a retryable 503 before their body
        is read. This capacity limit is per process, not shared across instances.
        An explicit GB or US storefront selects GBP or USD respectively.
        Omitting it retains the configured Channel3 locale; the response reports
        the country and currency actually requested from Channel3. Each offer's
        own currency remains authoritative. Offers on recognized country-coded
        retailer domains and explicitly mapped curated-retailer domains are
        removed when their market conflicts with the selected storefront;
        generic domains remain unclassified because Channel3 does not provide
        retailer shipping-region metadata. Explicit priceRange values and
        common budget phrases in query (for example, "under 150") are applied
        as structured price filters in that currency. A query made up only of
        a recognized budget phrase is allowed: the provider receives the
        generic term "products" with the structured filter. Currency symbols or
        codes in a budget phrase must match the selected storefront. The
        explicit phrases "from", "at", or "via" followed by Target, CVS,
        Walmart, or Best Buy in a search query apply an exact Channel3 retailer
        filter for that US merchant. Only matching retailer offers are returned;
        these retailer constraints are unavailable in the GB storefront and
        return 400. The query is unchanged in the response. The
        optional mode defaults to "default". "agentic" sends the complete
        natural-language brief to Channel3's agentic search planner while also
        applying any recognized budget as a structured price filter. Agentic
        search can take several seconds. It discovers products only; the app
        does not create an order or payment, and checkout remains with the
        selected retailer. Offers are included only when the initial HTTPS URL
        matches the listed retailer or Channel3 affiliate host. Continuation
        tokens are bound to the requested mode.
        Channel3's response is limited by this application to 2097152 decoded
        bytes (2 MiB); a declared
        Content-Length above that limit is also rejected, including when it
        describes encoded bytes. The application allows 12 seconds for default
        Channel3 search and 20 seconds for agentic search, including provider
        response headers and body; other Channel3 endpoints retain an
        eight-second provider deadline. These are application time limits, not
        a provider latency guarantee or a claim about Channel3's maximum
        response size.
        When CHANNEL3_COLLECTION_ID is configured, searches remain scoped to
        that collection without an unscoped fallback. A continuation token is
        application-wrapped, expires after 15 minutes, and is bound to the
        exact search query, requested mode, effective price range, collection,
        locale, and page size. A changed selection requires a new search without
        a token. Each continuation is a separate rate-limited request. Provider ranking and catalog contents
        can change between pages, so exhausting a bounded search does not prove
        that a product is absent from the collection.
        All responses, including validation errors and preflights, carry
        Cache-Control: no-store.
      requestBody:
        required: true
        description: JSON request body, limited to 8192 UTF-8 bytes (8 KiB); the body must finish reading within 3 seconds. Unrecognized top-level fields are ignored and never forwarded to Channel3.
        x-max-body-bytes: 8192
        x-body-read-timeout-ms: 3000
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required: [query]
              properties:
                query:
                  type: string
                  minLength: 2
                  maxLength: 120
                  description: >-
                    Product search text or a supported price-only phrase.
                    Common budget phrases such as "under 150" are applied as a
                    structured price filter in the resolved storefront currency.
                    Quick search removes recognized budget text from the
                    provider query; agentic mode preserves the full brief.
                    An explicit "from", "at", or "via" retailer phrase for
                    Target, CVS, Walmart, or Best Buy applies an exact US offer
                    filter; the GB storefront returns 400 for these merchants.
                    A quick-search query containing only a budget phrase uses
                    the generic provider query "products" with the filter.
                mode:
                  type: string
                  enum: [default, agentic]
                  default: default
                  description: >-
                    Use agentic for an explicit natural-language shopping brief.
                    Agentic mode may take several seconds and returns discovery
                    results only; it does not place orders.
                limit:
                  type: integer
                  minimum: 1
                  maximum: 24
                  default: 6
                storefront:
                  $ref: "#/components/schemas/MarketplaceStorefront"
                priceRange:
                  $ref: "#/components/schemas/MarketplacePriceRange"
                pageToken:
                  type: string
                  minLength: 1
                  maxLength: 6144
                  description: Application-wrapped continuation from a search with identical query, storefront, mode, limit, and effective price range.
      responses:
        "200":
          description: Live Channel3 search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceSearchResponse"
        "400":
          description: Request JSON, query, mode, storefront, or price range is invalid, or a recognized US retailer was requested in the GB storefront
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceErrorResponse"
        "403":
          description: Origin and Host headers are both present but identify different hosts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceErrorResponse"
        "408":
          description: The request body did not finish streaming within 3 seconds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceErrorResponse"
        "413":
          description: The request body exceeds 8192 bytes (8 KiB)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceErrorResponse"
        "429":
          description: Search request limit reached
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: string
                pattern: "^[0-9]+$"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceErrorResponse"
        "503":
          description: >-
            Channel3 search or its default locale is not configured correctly,
            the provider is temporarily unavailable, its response exceeds the
            app's limit, contains malformed UTF-8 or JSON, or has an invalid
            product shape, or the request-body reading capacity is temporarily
            full. The capacity
            response includes Retry-After; provider failures may omit it.
          headers:
            Retry-After:
              description: Seconds to wait before retrying when body-reading capacity is full
              schema:
                type: string
                pattern: "^[0-9]+$"
            Cache-Control:
              description: Capacity and provider failure responses are not cacheable
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceErrorResponse"
        "504":
          description: The Channel3 search exceeded the app's provider deadline; no results are returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceErrorResponse"
    options:
      operationId: preflightMarketplaceSearch
      summary: Check whether the mobile web client may search
      responses:
        "204":
          description: Preflight approved for an exact allowlisted origin
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
            Access-Control-Allow-Methods:
              schema:
                type: string
            Access-Control-Allow-Headers:
              schema:
                type: string
        "403":
          description: Origin, method, or requested header is not allowed
  /api/marketplace/products/{productId}:
    get:
      operationId: getCurrentMarketplaceProduct
      summary: Recheck current offers for one product
      description: >-
        Retrieves full current Channel3 product details by a stable product ID
        returned by a previous search or catalog browse. Use this at display and
        retailer-handoff time instead of reusing a stored offer URL. The
        Channel3 API key remains server-side. Explicit GB or US storefronts
        select GBP or USD. A product with no offer in that storefront returns
        404 with code PRODUCT_UNAVAILABLE; clients must not treat that response
        as a missing route or fall back to an older URL. Results are no-store and
        share the marketplace rate limit. Only offers with an HTTPS link to the
        listed retailer or Channel3 affiliate host are returned. If offers exist
        but none have a safe initial link, the response is 503, not a claim that
        the item is unavailable. This is a fresh Channel3 report, not
        a guarantee of retailer-side inventory; the retailer confirms final
        price and availability.
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{1,128}$"
        - name: storefront
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/MarketplaceStorefront"
      responses:
        "200":
          description: Fresh product details and current Channel3 offers
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceProductRefreshResponse"
        "400":
          description: Product ID or storefront is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceErrorResponse"
        "403":
          description: Origin and Host headers are both present but identify different hosts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceErrorResponse"
        "404":
          description: Product has no current Channel3 result or storefront offer; code is PRODUCT_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceProductUnavailableResponse"
        "429":
          description: Shared marketplace request limit reached
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: string
                pattern: "^[0-9]+$"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceErrorResponse"
        "503":
          description: Channel3 is not configured, unavailable, timed out, returned an invalid product, or no safe initial retailer link could be confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceErrorResponse"
    options:
      operationId: preflightMarketplaceProduct
      summary: Check whether the mobile web client may retrieve a product
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{1,128}$"
      responses:
        "204":
          description: Preflight approved for an exact allowlisted origin
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
            Access-Control-Allow-Methods:
              schema:
                type: string
            Access-Control-Allow-Headers:
              schema:
                type: string
        "403":
          description: Origin, method, or requested header is not allowed
  /api/marketplace/products/{productId}/similar:
    get:
      operationId: findSimilarMarketplaceProducts
      summary: Find in-stock alternatives for one marketplace product
      description: >-
        Requests Channel3's product-ID-based similar recommendations for the
        exact GB or US storefront. The server filters Channel3 to new offers
        reported in stock and returns provider-ranked products only when they have at
        least one explicit in-stock offer with a safe retailer or affiliate URL.
        The response is not cached.
        Channel3's similar endpoint is not scoped to the app-wide curated
        collection; results are Channel3 recommendations for the selected
        storefront. The client accepts only explicit in-stock offers with safe
        retailer URLs. Each chosen alternative is refreshed by its exact
        product ID and retailer immediately before handoff. This is not a
        guarantee of retailer-side inventory. A 404 means Channel3 has no
        similar result for the source product or no result passes the in-stock
        link check; clients may fall back to the title-based curated search.
        Requests share the marketplace rate limit. Offers on recognized
        country-coded retailer domains and explicitly mapped curated-retailer
        domains are removed when their market conflicts with the selected
        storefront; generic domains remain unclassified because Channel3 does
        not provide shipping-region metadata.
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{1,128}$"
        - name: storefront
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/MarketplaceStorefront"
      responses:
        "200":
          description: Provider-ranked similar products for the selected storefront
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceSimilarResponse"
        "400":
          description: Product ID or storefront is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceErrorResponse"
        "403":
          description: Origin and Host headers are both present but identify different hosts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceErrorResponse"
        "404":
          description: No provider result passes the explicit in-stock safe-link filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceErrorResponse"
        "429":
          description: Shared marketplace request limit reached
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: string
                pattern: "^[0-9]+$"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceErrorResponse"
        "503":
          description: Channel3 is unavailable, timed out, or returned invalid products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceErrorResponse"
    options:
      operationId: preflightSimilarMarketplaceProducts
      summary: Check mobile web access to similar products
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{1,128}$"
      responses:
        "204":
          description: Preflight approved for an exact allowlisted origin
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
            Access-Control-Allow-Methods:
              schema:
                type: string
            Access-Control-Allow-Headers:
              schema:
                type: string
        "403":
          description: Origin, method, or requested header is not allowed
  /api/marketplace/catalog:
    get:
      operationId: browseCuratedCatalog
      summary: Browse an app-wide curated Channel3 category
      description: >-
        Returns fresh Channel3 products for an allowlisted section, retailer, or both.
        At least one of section or retailer is required. At most 24 products
        are returned per request. Continuation uses only provider-issued opaque
        tokens wrapped by the application, never invented numeric pages. Tokens
        expire after 15 minutes and bind the exact filters, locale, and limit.
        Changing any selection requires starting again without pageToken.
        Duplicate or unknown query fields are rejected. Offers are included only
        when the initial HTTPS URL matches the listed retailer or Channel3
        affiliate host.
        The section maps to a verified Channel3 category slug; callers cannot
        supply arbitrary filters. Results are not saved to customer collections.
        Retailer offer details can change, and this endpoint does not create a
        checkout or payment. Requests share the marketplace rate limit. Explicit
        GB and US storefronts select GBP and USD respectively. If omitted, the
        configured Channel3 locale is retained and reported in the response.
        Offers on recognized country-coded retailer domains and explicitly
        mapped curated-retailer domains are removed when their market conflicts
        with the selected storefront; generic domains remain unclassified
        because Channel3 does not provide shipping-region metadata. A curated
        retailer must support the effective storefront. Unsupported retailer
        and storefront combinations return 400 before calling Channel3.
        Channel3's response is limited by this application to 2097152 decoded
        bytes (2 MiB); a declared Content-Length above that limit is also
        rejected, including when it describes encoded bytes. Provider headers
        and body must arrive within the existing eight-second request deadline.
        This is an app limit, not a Channel3 maximum.
        Curated browsing always requires CHANNEL3_COLLECTION_ID to contain a
        valid shared collection ID. Missing or invalid configuration returns
        503 before calling Channel3. A configured collection is always applied
        to browse requests; there is no unscoped fallback. Explicit text search
        remains a separate path and can omit the collection. Catalog
        continuations bind the required collection as well as selections.
        All responses, including validation errors and preflights, carry
        Cache-Control: no-store.
      parameters:
        - name: section
          in: query
          required: false
          description: App-wide editorial section, distinct from a customer's saved list
          schema:
            type: string
            description: An ID from the shared curated section allowlist.
        - name: storefront
          in: query
          required: false
          description: Storefront for this request; omit to use the configured Channel3 locale
          schema:
            $ref: "#/components/schemas/MarketplaceStorefront"
        - name: retailer
          in: query
          required: false
          schema: { type: string }
          description: An ID from the shared curated retailer allowlist, supported in the effective storefront. May be combined with section.
        - name: limit
          in: query
          required: false
          schema: { type: integer, enum: [12, 24], default: 24 }
        - name: pageToken
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 6144 }
          description: Opaque continuation from the previous response with identical selections.
      responses:
        "200":
          description: Fresh products and offers for the curated section
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceCatalogResponse"
        "400":
          description: The section is missing or unsupported, the storefront is malformed, duplicated, or unsupported, or the retailer is unavailable in the effective storefront
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceErrorResponse"
        "403":
          description: Request origin is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceErrorResponse"
        "429":
          description: Shared marketplace request limit reached
          headers:
            Retry-After:
              schema:
                type: string
                pattern: "^[0-9]+$"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceErrorResponse"
        "503":
          description: >-
            The shared Channel3 collection, browse configuration, or default
            locale is missing or invalid; the provider is temporarily
            unavailable; or its response exceeds the app's limit, times out,
            contains malformed UTF-8 or JSON, or has an invalid product shape.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceErrorResponse"
    options:
      operationId: preflightCuratedCatalog
      summary: Check whether the mobile web client may browse a curated section
      responses:
        "204":
          description: Preflight approved for an exact allowlisted origin
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
            Access-Control-Allow-Methods:
              schema:
                type: string
            Access-Control-Allow-Headers:
              schema:
                type: string
        "403":
          description: Origin, method, or requested header is not allowed
components:
  responses:
    MarketPreflightAllowed:
      description: Preflight approved for an exact allowlisted mobile-web origin
      headers:
        Access-Control-Allow-Origin:
          schema:
            type: string
        Access-Control-Allow-Methods:
          schema:
            type: string
        Access-Control-Allow-Headers:
          schema:
            type: string
        Vary:
          schema:
            type: string
    MarketPreflightDenied:
      description: Origin, method, or requested header is not allowed
      headers:
        Cache-Control:
          schema:
            type: string
        Vary:
          schema:
            type: string
  schemas:
    MarketCurrency:
      type: string
      enum: [USD, GBP, EUR, AED, AUD, BRL, CAD, CHF, CNY, CZK, DKK, HKD, HUF, ILS, INR, JPY, MXN, MYR, NOK, NZD, PHP, PLN, SEK, SGD, THB, TWD, ZAR]
      description: Fiat display currency for the market reference values.
    MarketQuotes:
      type: object
      additionalProperties: false
      required: [currency, provider, retrievedAt, coins]
      properties:
        currency:
          $ref: "#/components/schemas/MarketCurrency"
        provider:
          type: string
          const: CoinGecko
        retrievedAt:
          type: string
          format: date-time
        coins:
          type: array
          minItems: 1
          maxItems: 7
          description: >-
            At most one record per tracked coin ID. A response may contain a
            subset of the watchlist; duplicate IDs from the provider are rejected.
          items:
            $ref: "#/components/schemas/MarketQuote"
    MarketQuote:
      type: object
      additionalProperties: false
      required: [id, symbol, name, rank, price, marketCap, volume24h, change24hPct, change7dPct, high24h, low24h, sparkline7d, lastUpdated]
      properties:
        id:
          type: string
          enum: [bitcoin, ethereum, solana, chainlink, litecoin, bitcoin-cash, paypal-usd]
        symbol:
          type: string
        name:
          type: string
        rank:
          type: [integer, "null"]
          minimum: 1
        price:
          type: [number, "null"]
          minimum: 0
        marketCap:
          type: [number, "null"]
          minimum: 0
        volume24h:
          type: [number, "null"]
          minimum: 0
        change24hPct:
          type: [number, "null"]
        change7dPct:
          type: [number, "null"]
        high24h:
          type: [number, "null"]
          minimum: 0
        low24h:
          type: [number, "null"]
          minimum: 0
        sparkline7d:
          type: array
          items:
            type: number
            minimum: 0
        lastUpdated:
          type: [string, "null"]
          format: date-time
    MarketOverview:
      type: object
      additionalProperties: false
      required: [currency, provider, retrievedAt, coins]
      properties:
        currency:
          type: string
          const: USD
        provider:
          type: string
          const: CoinGecko
        retrievedAt:
          type: string
          format: date-time
        coins:
          type: array
          minItems: 1
          maxItems: 7
          description: >-
            At most one record per tracked coin ID. A response may contain a
            subset of the watchlist; duplicate IDs from the provider are rejected.
          items:
            $ref: "#/components/schemas/MarketCoin"
    MarketCoin:
      type: object
      additionalProperties: false
      required:
        - id
        - symbol
        - name
        - rank
        - priceUsd
        - marketCapUsd
        - volume24hUsd
        - change24hPct
        - change7dPct
        - high24hUsd
        - low24hUsd
        - sparkline7d
        - lastUpdated
      properties:
        id:
          type: string
          enum: [bitcoin, ethereum, solana, chainlink, litecoin, bitcoin-cash, paypal-usd]
        symbol:
          type: string
        name:
          type: string
        rank:
          type: [integer, "null"]
          minimum: 1
        priceUsd:
          type: [number, "null"]
          minimum: 0
        marketCapUsd:
          type: [number, "null"]
          minimum: 0
        volume24hUsd:
          type: [number, "null"]
          minimum: 0
        change24hPct:
          type: [number, "null"]
        change7dPct:
          type: [number, "null"]
        high24hUsd:
          type: [number, "null"]
          minimum: 0
        low24hUsd:
          type: [number, "null"]
          minimum: 0
        sparkline7d:
          type: array
          items:
            type: number
            minimum: 0
        lastUpdated:
          type: [string, "null"]
          format: date-time
    MarketChart:
      type: object
      additionalProperties: false
      required: [coinId, currency, days, provider, retrievedAt, seriesSource, availableMetrics, prices, marketCaps, volumes]
      properties:
        coinId:
          type: string
          enum: [bitcoin, ethereum, solana, chainlink, litecoin, bitcoin-cash, paypal-usd]
        currency:
          $ref: "#/components/schemas/MarketCurrency"
        days:
          type: integer
          enum: [1, 7, 30, 90, 365]
        provider:
          type: string
          const: CoinGecko
        retrievedAt:
          type: string
          format: date-time
        seriesSource:
          type: string
          enum: [market_chart, market_overview_sparkline]
          description: >-
            market_chart indicates full historical data. market_overview_sparkline
            indicates the cached price-only fallback; its sample timestamps are
            approximately evenly spaced across the 7-day window and rounded to
            whole milliseconds because the upstream values do not include
            per-point timestamps.
        availableMetrics:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [price, marketCap, volume]
        prices:
          type: array
          items:
            $ref: "#/components/schemas/ChartPoint"
        marketCaps:
          type: array
          items:
            $ref: "#/components/schemas/ChartPoint"
        volumes:
          type: array
          items:
            $ref: "#/components/schemas/ChartPoint"
    MarketCandles:
      type: object
      additionalProperties: false
      required: [coinId, currency, days, source, retrievedAt, candleIntervalMinutes, timestampKind, candles]
      properties:
        coinId:
          type: string
          enum: [bitcoin, ethereum, solana, chainlink, litecoin, bitcoin-cash, paypal-usd]
        currency:
          $ref: "#/components/schemas/MarketCurrency"
        days:
          type: integer
          enum: [1, 7, 30, 90, 365]
        source:
          type: string
          const: CoinGecko
        retrievedAt:
          type: string
          format: date-time
        candleIntervalMinutes:
          type: integer
          enum: [30, 240, 5760]
          description: Nominal Demo candle interval for the requested days; gaps may occur
        timestampKind:
          type: string
          const: close
        candles:
          type: array
          maxItems: 1000
          description: Strictly increasing unique close timestamps; missing periods are not filled
          items:
            $ref: "#/components/schemas/Candle"
    Candle:
      type: object
      additionalProperties: false
      required: [timestamp, open, high, low, close]
      description: Finite nonnegative OHLC values; low is at most open and close, high is at least open and close
      properties:
        timestamp:
          type: integer
          format: int64
          minimum: 1
          maximum: 8640000000000000
          description: Candle close time as Unix milliseconds
        open:
          type: number
          minimum: 0
        high:
          type: number
          minimum: 0
        low:
          type: number
          minimum: 0
        close:
          type: number
          minimum: 0
    ChartPoint:
      type: object
      additionalProperties: false
      required: [timestamp, value]
      properties:
        timestamp:
          type: integer
          format: int64
          minimum: -8640000000000000
          maximum: 8640000000000000
          description: Unix timestamp in whole milliseconds within the JavaScript Date range
        value:
          type: number
          minimum: 0
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [market_data_unavailable, market_data_not_configured, market_data_rate_limited, upstream_invalid_response, unsupported_coin, unsupported_days, unsupported_currency, unsupported_parameters, origin_not_allowed]
            message:
              type: string
    MarketplaceStorefront:
      type: string
      enum: [GB, US]
      description: GB selects GBP; US selects USD. The country affects available offers.
    MarketplacePriceRange:
      type: object
      additionalProperties: false
      description: Price limits in the resolved storefront currency, intersected with any budget phrase in query.
      properties:
        minPrice:
          type: number
          minimum: 0
          maximum: 100000000
        maxPrice:
          type: number
          minimum: 0
          maximum: 100000000
      anyOf:
        - required: [minPrice]
        - required: [maxPrice]
    MarketplaceSearchResponse:
      type: object
      additionalProperties: false
      required: [provider, storefront, currency, query, priceRange, retrievedAt, products, nextPageToken]
      properties:
        provider:
          type: string
          const: Channel3
        storefront:
          type: string
          description: Effective Channel3 country; omitted request selection may use another supported configured country.
        currency:
          type: string
          description: Effective requested currency; each offer's own currency remains authoritative.
        query:
          type: string
        searchMode:
          type: string
          enum: [default, agentic]
          description: Present when the request explicitly supplies mode; identifies the effective Channel3 mode used for this page and its continuations. Omitted for legacy requests without mode.
        priceRange:
          anyOf:
            - $ref: "#/components/schemas/MarketplacePriceRange"
            - type: "null"
          description: Effective structured price limits applied to the provider request, or null when no price filter is active.
        retrievedAt:
          type: string
          format: date-time
        products:
          type: array
          items:
            $ref: "#/components/schemas/MarketplaceProduct"
        nextPageToken:
          type: [string, "null"]
          description: Opaque application-wrapped continuation, or null when the provider supplies none.
    MarketplaceCatalogResponse:
      type: object
      additionalProperties: false
      required: [provider, storefront, currency, section, title, retrievedAt, products, retailer, limit, nextPageToken]
      properties:
        provider:
          type: string
          const: Channel3
        storefront:
          type: string
          description: Effective Channel3 country; omitted request selection may use another supported configured country.
        currency:
          type: string
          description: Effective requested currency; each offer's own currency remains authoritative.
        section:
          type: [string, "null"]
        retailer:
          type: [string, "null"]
        limit:
          type: integer
          enum: [12, 24]
        nextPageToken:
          type: [string, "null"]
          maxLength: 6144
        title:
          type: string
        retrievedAt:
          type: string
          format: date-time
        products:
          type: array
          maxItems: 24
          items:
            $ref: "#/components/schemas/MarketplaceProduct"
    MarketplaceProductRefreshResponse:
      type: object
      additionalProperties: false
      required: [provider, storefront, currency, retrievedAt, product]
      properties:
        provider:
          type: string
          const: Channel3
        storefront:
          $ref: "#/components/schemas/MarketplaceStorefront"
        currency:
          type: string
          enum: [GBP, USD]
        retrievedAt:
          type: string
          format: date-time
        product:
          $ref: "#/components/schemas/MarketplaceProduct"
    MarketplaceSimilarResponse:
      type: object
      additionalProperties: false
      required: [provider, productId, storefront, currency, retrievedAt, products]
      properties:
        provider:
          type: string
          const: Channel3
        productId:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,128}$"
        storefront:
          $ref: "#/components/schemas/MarketplaceStorefront"
        currency:
          type: string
          enum: [GBP, USD]
        retrievedAt:
          type: string
          format: date-time
        products:
          type: array
          maxItems: 24
          items:
            $ref: "#/components/schemas/MarketplaceProduct"
    MarketplaceProduct:
      type: object
      additionalProperties: true
      required: [id, title]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: [string, "null"]
        images:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                format: uri
              cleaned_url:
                type: [string, "null"]
                format: uri
              is_main_image:
                type: boolean
        offers:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                format: uri
              domain:
                type: string
              availability:
                type: string
                enum: [InStock, OutOfStock]
              max_commission_rate:
                type: [number, "null"]
                minimum: 0
                maximum: 1
                description: Channel3-advertised maximum retailer affiliate commission as a decimal fraction (0.05 is 5%). Actual commission can be lower. Missing or null means unknown, not zero; this is not customer cashback.
              price:
                type: object
                properties:
                  price:
                    type: number
                    minimum: 0
                  currency:
                    type: string
                  compare_at_price:
                    type: [number, "null"]
                    minimum: 0
    MarketplaceProductUnavailableResponse:
      type: object
      additionalProperties: false
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
          const: PRODUCT_UNAVAILABLE
    MarketplaceErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
