openapi: 3.1.0
info:
  title: PayPal Markets Customer Web Sign-in
  version: 0.1.0
  description: >-
    Customer website sign-in using an explicitly enabled PayPal authorization
    code flow and a separate durable server-side session store. Sign-in does
    not grant merchant, payment, wallet, internal management, or other provider
    permissions. Account type is optional and is not an authorization role.
    All responses are no-store and use Referrer-Policy no-referrer. Sandbox and live provider configuration and
    eligibility must be independently verified before enabling this feature.
    New web sign-in additionally requires separate explicit operator acknowledgements
    for web edge controls and callback redaction. Missing acknowledgements block start503
    and redirect configured callbacks to a fixed clean303failure without transaction
    consumption. Existing session validation and logout remain available; loginAvailable
    is false and discovery is skipped. These flags do not establish verified enforcement
    and do not gate native admission or change the session context fingerprint.
servers:
  - url: /
paths:
  /api/auth/paypal/start:
    post:
      operationId: startCustomerSignIn
      summary: Start a same-origin customer sign-in
      description: >-
        A same-origin top-level form POST begins a short-lived, single-use
        authorization transaction and redirects to PayPal. The browser receives
        a Secure, HttpOnly, SameSite=Lax, host-only transaction cookie. No
        client-provided return URL or account type is accepted. Transactions
        are bound to the active login configuration and cannot complete after
        that configuration changes. If the browser supplies an earlier
        transaction cookie without an active session, the earlier transaction
        must still be valid in the same context; otherwise start returns the
        generic unavailable response rather than creating an unrelated family.
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '303':
          description: Redirect to the configured and validated PayPal authorization endpoint.
          headers:
            Location:
              required: true
              schema: { type: string, format: uri }
            Set-Cookie:
              required: true
              schema: { type: string }
            Cache-Control:
              required: true
              schema: { type: string, const: no-store }
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/auth/paypal/callback:
    get:
      operationId: completeCustomerSignIn
      summary: Complete a PayPal authorization response
      description: >-
        PayPal redirects the browser here with a single-use authorization
        response. The callback query is at most 4 KiB in UTF-8. Unrecognized
        parameters are ignored without being forwarded or reflected; recognized
        parameters must not be duplicated. Unsupported hybrid, JARM and token
        response fields (response, id_token, access_token, token, token_type,
        expires_in and refresh_token) are rejected even when empty. Code and error
        must not occur together. Error description and error URI may accompany an
        error response and are discarded without reflection. A successful code
        response may include one nonempty RFC 6749 scope string of at most 1024
        ASCII bytes; it is discarded and never grants authority. A single bounded
        issuer is forwarded to the OpenID verifier and required when discovery
        advertises authorization_response_iss_parameter_supported. The server
        atomically matches callback state while claiming the browser-bound transaction;
        a wrong state in the same unexpired context fails without consuming it.
        Expiry is checked against the advancing database clock after any row-lock
        wait, before provider work. When a matching claim commits, the stored
        state, nonce, and PKCE verifier are logically replaced with non-secret
        markers before provider work begins. Expired or cross-context pending
        transactions are completed and their stored values cleared atomically.
        Abandoned pending transactions remain until a later cleanup; database
        history and backups may retain previous values under their own policies.
        Before issuing a session, the server rechecks the login transaction,
        session family and any initiating session after the relevant storage
        locks are acquired. An attempt that expires while waiting fails without
        issuing a new session.
        A matching state can be claimed once for a code or error response. The server validates
        state, PKCE, nonce, ID-token signature and claims, and userinfo subject.
        Success rotates any prior application session and sets a new Secure,
        HttpOnly, SameSite=Lax host-only session cookie. Provider errors redirect to a
        fixed local account page with a generic failure marker. Enabled callback budget
        or concurrency failures redirect303 before consuming the transaction;
        exhaustion also carries Retry-After1..60. Storage failures use the same fixed
        failure destination without setting a session cookie; a claim or session
        write may already have committed, so a new sign-in may be required. Callback
        responses do not clear the short-lived transaction cookie, avoiding
        deletion of a newer sign-in cookie by a delayed response. Provider
        credentials, tokens, account identifiers and authorization codes are
        never returned to the page or included in the redirect destination.
        Disabled or incomplete configuration returns a fixed relative Location
        /dashboard?auth=failed#account without backend access or request-host interpolation.
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string, maxLength: 2048 }
        - name: state
          in: query
          required: false
          schema:
            type: string
            minLength: 43
            maxLength: 43
            pattern: '^[A-Za-z0-9_-]{43}$'
        - name: error
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
        - name: error_description
          in: query
          required: false
          description: Optional error detail; accepted only with an error and discarded without reflection.
          schema: { type: string, maxLength: 4096 }
        - name: error_uri
          in: query
          required: false
          description: Optional error detail; accepted only with an error and discarded without reflection.
          schema: { type: string, maxLength: 4096 }
        - name: scope
          in: query
          required: false
          description: Optional informational scope on a successful code response only; not an authorization grant.
          schema:
            type: string
            minLength: 1
            maxLength: 1024
            pattern: '^[\x21\x23-\x5B\x5D-\x7E]+(?: [\x21\x23-\x5B\x5D-\x7E]+)*$'
        - name: iss
          in: query
          required: false
          description: Authorization response issuer; passed unchanged to the OpenID verifier on code responses.
          schema:
            type: string
            minLength: 1
            maxLength: 2048
            pattern: '^[\x21-\x7E]+$'
      # Disabled/incomplete configuration redirects303 using a fixed relative Location,
      # without request Host/URL interpolation, cookie mutation or backend/provider work.
      responses:
        '303':
          description: Redirect to the fixed local account page after success or generic failure.
          headers:
            Location:
              required: true
              schema: { type: string }
            Set-Cookie:
              schema: { type: string }
            Cache-Control:
              required: true
              schema: { type: string, const: no-store }
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
  /api/auth/session:
    get:
      operationId: getCustomerSession
      summary: Read the current customer web session
      description: >-
        An absent, expired, or revoked cookie returns authenticated false.
        Session and family expiry use the advancing database clock after a
        storage wait, rather than the start of a delayed query.
        The optional provider account type only chooses an initial presentation;
        PREMIER and other unrecognized values remain unknown until their
        semantics for this application are established.
        it is never proof of permission to perform a business action. An
        authenticated session also returns a stable, pseudonymous application
        dataScope derived from the validated issuer and subject. It is not an
        authentication credential, an anonymous identifier, or a sync feature.
        Existing shared guest data is not automatically assigned to it. A
        session is not valid after the login environment, issuer, client ID
        or secret, origin, scope or signing-key configuration changes. An unavailable
        session store cannot confirm an existing cookie. The
        loginAvailable flag means that the enabled feature passed current
        store and provider-metadata preflight; it does not prove the client
        credentials, customer consent, or PayPal scope eligibility. Disabled
        or incomplete configuration with no session returns false for both.
      responses:
        '200':
          description: Authenticated or signed-out application session.
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: no-store }
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties: false
                    required: [authenticated, loginAvailable]
                    properties:
                      authenticated: { type: boolean, const: false }
                      loginAvailable: { type: boolean }
                  - type: object
                    additionalProperties: false
                    required: [authenticated, loginAvailable, accountType, dataScope]
                    properties:
                      authenticated: { type: boolean, const: true }
                      loginAvailable: { type: boolean }
                      accountType:
                        type: string
                        enum: [personal, business, unknown]
                      dataScope:
                        type: string
                        pattern: '^v1_[A-Za-z0-9_-]{43}$'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/auth/logout:
    post:
      operationId: signOutCustomer
      summary: Revoke the current application session
      description: >-
        A same-origin POST invalidates the current session family and any
        pending sign-in attached to the supplied session or transaction cookie,
        then clears both cookies. A callback that finishes later cannot restore
        that family's session. Independently bootstrapped guest flows without
        a common established session or transaction cookie are not linked.
        This signs out of this app;
        it does not make a PayPal consent-revocation request.
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '204':
          description: The application session is absent or revoked.
          headers:
            Set-Cookie:
              required: true
              schema: { type: string }
            Cache-Control:
              required: true
              schema: { type: string, const: no-store }
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  headers:
    NoReferrer:
      required: true
      schema: { type: string, const: no-referrer }
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      description: Must exactly match the configured public HTTPS origin.
      schema: { type: string, format: uri }
  responses:
    RateLimited:
      description: Shared global operation budget exhausted. Existing session cookies remain unchanged. Not a per-client or verified edge limit.
      headers:
        Retry-After:
          required: true
          schema: { type: integer, minimum: 1, maximum: 60 }
        Cache-Control:
          required: true
          schema: { type: string, const: no-store }
        Referrer-Policy:
          $ref: '#/components/headers/NoReferrer'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The request origin is missing or does not match.
      headers:
        Cache-Control:
          required: true
          schema: { type: string, const: no-store }
        Referrer-Policy:
          $ref: '#/components/headers/NoReferrer'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: Sign-in, request-budget storage or session storage is disabled, unconfigured, temporarily unavailable, or at a retained-record capacity limit. Capacity failures use the same generic response as other unavailable states.
      headers:
        Cache-Control:
          required: true
          schema: { type: string, const: no-store }
        Referrer-Policy:
          $ref: '#/components/headers/NoReferrer'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string }
