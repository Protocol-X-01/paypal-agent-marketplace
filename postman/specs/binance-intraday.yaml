openapi: 3.1.0
info:
  title: PayPal Markets Public Intraday Candles
  version: 0.1.0
  description: >-
    Read-only Binance Spot trade candles quoted in USDT. USDT is a distinct
    cryptoasset, not USD or GBP; prices are not converted. This data is not a
    PayPal execution quote. Commercial redistribution permission has not been
    established. Requests make no account, wallet, or trading calls.
servers:
  - url: /
paths:
  /api/market/intraday/{coinId}:
    get:
      operationId: getIntradayCandles
      summary: Get completed public spot candles
      description: >-
        One day is supported for 3m, 5m, 15m, 30m, 1h, and 4h. Seven days is
        supported for 15m, 30m, 1h, 4h, and 1d; the 1d interval requires the
        seven-day window. Unsupported interval/window pairs are rejected. The
        requested window is aligned to complete UTC candle
        boundaries. Missing or zero-trade intervals are never synthesized: an
        incomplete window returns intraday_data_gap. The latest candle is
        accepted only when its exclusive close precedes the provider's HTTP
        response Date. That header is not an independently verified exchange
        clock. Results are cached per process for up to 15 seconds. Access or
        redisplay may be restricted by region or provider terms. Requests are
        limited to six per rolling 60 seconds per detected client address, with
        at most two uncached upstream loads active for that address at a time.
        Cache hits and identical in-flight requests reuse existing work and do
        not consume another active slot. Missing or invalid client addresses
        share the unknown-address bucket. These in-memory limits are per server
        process and are not shared across service instances.
        The provider budget remains twelve calls per rolling 60 seconds per
        process, with at most four provider requests in flight.
      parameters:
        - name: coinId
          in: path
          required: true
          description: bitcoin, ethereum, solana, chainlink, litecoin, or bitcoin-cash. PayPal USD is unavailable from this feed.
          schema:
            type: string
        - name: interval
          in: query
          required: true
          schema:
            type: string
            enum: [3m, 5m, 15m, 30m, 1h, 4h, 1d]
        - name: days
          in: query
          required: true
          description: >-
            Seven days is available for 15m, 30m, 1h, 4h, and 1d. The 1d
            interval requires seven days. Unsupported windows are rejected,
            not truncated.
          schema:
            type: integer
            enum: [1, 7]
      responses:
        '200':
          description: Complete contiguous, closed trade candles, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntradayHistory'
        '400':
          description: Unsupported asset, interval, window, or query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Request origin is not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: >-
            A per-client request budget, per-process provider budget, or the
            provider's rate limit was reached.
            Numeric provider delays are preserved. An unrepresentably large
            delay blocks further provider calls until this process restarts;
            the returned Retry-After then indicates when to check again.
          headers:
            Retry-After:
              description: Seconds before another attempt.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: The provider response failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The provider, clock evidence, or a complete trading history is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    options:
      operationId: preflightIntradayCandles
      summary: Check the allowed mobile web origin
      parameters:
        - name: coinId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Allowed preflight.
        '403':
          description: Origin, method, or request headers are not allowed.
components:
  schemas:
    IntradayHistory:
      type: object
      additionalProperties: false
      required: [coinId, source, quote, interval, intervalMinutes, days, timestampKind, observedAt, retrievedAt, coveredStart, coveredEnd, count, candles]
      properties:
        coinId:
          type: string
          enum: [bitcoin, ethereum, solana, chainlink, litecoin, bitcoin-cash]
        source:
          const: Binance Spot
        quote:
          const: USDT
        interval:
          type: string
          enum: [3m, 5m, 15m, 30m, 1h, 4h, 1d]
        intervalMinutes:
          type: integer
          enum: [3, 5, 15, 30, 60, 240, 1440]
        days:
          type: integer
          enum: [1, 7]
        timestampKind:
          const: close
        observedAt:
          type: string
          format: date-time
          description: Provider HTTP response Date, used to exclude still-open candles; not an independent exchange clock guarantee.
        retrievedAt:
          type: string
          format: date-time
          description: Server time after the provider response was read; remains unchanged when served from cache.
        coveredStart:
          type: integer
          description: Unix milliseconds of the first candle's open.
        coveredEnd:
          type: integer
          description: Unix milliseconds of the final candle's exclusive close.
        count:
          type: integer
          minimum: 1
          maximum: 1000
        candles:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Candle'
    Candle:
      type: object
      additionalProperties: false
      required: [timestamp, open, high, low, close]
      properties:
        timestamp:
          type: integer
          description: Exclusive candle close time in Unix milliseconds.
        open:
          type: number
          minimum: 0
        high:
          type: number
          minimum: 0
        low:
          type: number
          minimum: 0
        close:
          type: number
          minimum: 0
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
