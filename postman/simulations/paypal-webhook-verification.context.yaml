  - id: failure-and-timeout-behavior
    status: supported
    claim: In the modeled local cases, rejected verification, malformed input, upstream failure, and a response delayed beyond the adapter deadline receive non-success responses.
    reason: The Postman collection checked the receiver's HTTP status and error bodies, and mock counters confirmed malformed requests never reached the fictional provider. The mock does not model cryptographic verification or payment processing.
    verification: >-
      On 2026-11-06, nine fictional Postman requests passed: success returned 200; rejection and malformed inputs returned 400; unsupported content type returned 415; upstream failure and an intentionally delayed response returned 503. The mock recorded one OAuth call and exactly four expected verification attempts. This does not verify live PayPal retry or delivery behavior.
