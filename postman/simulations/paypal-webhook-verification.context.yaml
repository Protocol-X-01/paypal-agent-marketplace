    claim: In the local fictional cases, the receiver embeds the original event bytes and expected headers in the verification request and acknowledges a modeled SUCCESS response without processing the event.
    reason: The mock compares raw event bytes, transmission headers, webhook ID, and synthetic authorization before returning its modeled response. This supports the local code path only; it cannot establish actual PayPal signature validity.
    verification: On 2026-11-06, the real receiver and adapter handled the fictional success case through the local HTTP stand-in, which accepted the original event bytes including spacing and a literal Unicode escape. The receiver returned HTTP 200 with received true and processed false. A real signed sandbox delivery is still required.
