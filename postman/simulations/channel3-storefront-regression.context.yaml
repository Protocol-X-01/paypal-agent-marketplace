simulation: Channel3 storefront regression
generated: '2026-11-06'
purpose:
  stands_in_for: Synthetic local responses from Channel3 search and category browse.
  unblocks: Repeatable checks that explicit UK and US choices and supported legacy defaults reach the provider request. The provider owner's mock was not searched because this work was restricted to local operations.
assumptions:
  - id: channel3-locale-config
    status: supported
    claim: Search and browse accept country, currency, and language inside config.
    reason: Channel3's official integration skill documents per-call locale overrides and supported GB/GBP and US/USD codes.
    verification: On 2026-11-06, four Postman requests exercised GB/GBP/en and US/USD/en search and browse against the local stand-in; all returned the expected synthetic locale-tagged products. The mock log recorded all provider requests. This does not establish live offer availability or conversion behavior.
    source: https://github.com/channel3-ai/skills/blob/main/skills/channel3-api/SKILL.md ; tests/channel3_storefront_simulation.py
    updated_at: '2026-11-06'
  - id: legacy-locale
    status: supported
    claim: An omitted storefront should preserve supported configured country, currency, and language values.
    reason: This is the application's backward-compatibility contract, not a provider guarantee.
    verification: On 2026-11-06, omitted-storefront search and browse retained an intentionally mixed DE/GBP/de configuration. The fixture encoded the received values in a synthetic product identifier.
    source: src/lib/channel3.ts ; tests/channel3_storefront_simulation.py
    updated_at: '2026-11-06'
  - id: live-regional-search-2026-11-06
    status: supported
    claim: >-
      For the specific two search requests observed on 2026-11-06, Channel3
      accepted the selected GB/GBP/en and US/USD/en locale configurations and
      returned offers in the corresponding requested currencies.
    reason: >-
      One read-only synthetic product query per locale reached the real provider
      through the application search route and adapter. This limited observation
      does not guarantee other products, stock, prices, or future availability.
    verification: >-
      Both provider and in-process route responses were HTTP 200; each returned
      three products and four offers. The website parser accepted all four
      offers in each region; observed offer currencies were GBP and USD
      respectively. A separate loopback-only Postman simulation also passed
      both regional route checks and logged two mock requests. The simulation
      used a temporary in-memory loopback transport adjustment and did not run
      the Next.js server. The real searches used the unmodified HTTPS adapter.
      Neither check exercised a hosted deployment, browser, mobile device,
      curated browsing, retailer handoff, or a purchase.
    source: >-
      src/app/api/marketplace/search/route.ts ; src/lib/channel3.ts ;
      src/lib/marketplace-storage.ts ; /tmp/paypal-region-sim-88om2mam.py ;
      /tmp/paypal-channel3-live-rxb3x8zu.cjs (temporary files may expire).
    updated_at: '2026-11-06'
