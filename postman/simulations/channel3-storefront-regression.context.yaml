  - id: app-upstream-body-limit-20261106
    status: supported
    claim: >-
      In the isolated synthetic scenarios exercised, the copied Channel3
      adapter accepted selected well-formed responses, including one at the
      app-owned 2 MiB decoded-byte boundary, and returned the routes' generic
      503 for the modeled oversize, malformed or stalled responses.
    reason: >-
      Focused stream tests exercised both actual route functions and the copied
      adapter. A separate loopback-only HTTPS stand-in exercised real Node fetch,
      including gzip expansion, redirects and an eight-second stalled body.
    verification: >-
      The unit tests covered exact-limit and split UTF-8 success, declared and
      chunked overflow, cancellation, malformed UTF-8 and JSON, a missing body,
      and a non-settling reader. The HTTPS stand-in exercised GB/US search and
      browse plus declared, chunked, compressed, malformed and redirected
      responses, and a stalled body returned 503 after approximately eight
      seconds. A separate existing Postman bridge passed four GB/US happy-path
      calls. These checks did not start Next.js or contact Channel3.
    source: >-
      src/lib/channel3.ts ; tests/channel3-response-limit.test.mjs ;
      tests/channel3_response_https_simulation.py ;
      tests/channel3_storefront_bridge_simulation.py
    updated_at: '2026-11-06'
