  - id: scoped-search-pagination-20261106
    status: supported
    claim: >-
      The application's search continuation retains the same query, collection,
      storefront and page size, and rejects a continuation used for a different
      storefront before calling the modeled provider.
    reason: >-
      The app signs a short-lived continuation binding and repeats the selected
      collection and locale on each request. The local mock requires a fictional
      collection and returns the target only on its second page.
    verification: >-
      On 2026-11-06 the isolated loopback Postman bridge invoked the actual route
      functions against the synthetic provider. Both pages passed, a cross-region
      continuation returned 400. One maintained Postman search request passed
      against the actual route via a loopback HTTP bridge, and the mock recorded
      five search and two browse requests. Focused fictional tests also cover query, collection and page-size
      changes, a tampered cursor, repeated provider cursors and bounded website
      and mobile rechecks. No live Channel3 request or Next server was exercised.
    source: >-
      tests/channel3_storefront_bridge_simulation.py ;
      tests/channel3-catalog-pagination.test.mjs ;
      tests/marketplace-storefront-component.test.mjs ;
      apps/mobile/tests/shop-storefront-screen.test.cjs ;
      https://github.com/channel3-ai/skills/blob/main/skills/channel3-api/references/api-reference.md
    updated_at: '2026-11-06'
  - id: live-us-search-continuation-20261106
    status: supported
    claim: >-
      For one US storefront search observed on 2026-11-06, the local development
      route returned a continuation, accepted it for the same search, and rejected
      its reuse for the GB storefront.
    reason: >-
      The response identified Channel3 and matched the requested query and
      US/USD storefront. The locally configured HTTPS base classified as the
      official Channel3 host; the source routes the request to that adapter.
      The running process's effective collection value and upstream traffic were
      not independently captured, so collection membership is not established.
    verification: >-
      Three bounded local HTTP requests used the generic query bags and limit 24.
      The initial page returned 24 products and a continuation; the next page
      returned 24 distinct product IDs with no overlap with the first page. Both
      responses were HTTP 200 and contained the no-store directive. Reusing the
      first continuation with GB returned HTTP 400; that error response did not
      contain an explicit no-store directive. The route and adapter source hashes
      were unchanged during the test. No customer data, purchase or provider
      write was involved. Results may vary with ranking, stock or time; no
      browser, phone, hosted release or individual product membership was checked.
    source: >-
      src/app/api/marketplace/search/route.ts ; src/lib/channel3.ts ;
      /home/protocol-x/Downloads/paypal-channel3-live-pagination-tt7sfy2m/results.json
    updated_at: '2026-11-06'
