  - id: next-dev-https-proxy-20261106
    status: supported
    claim: >-
      In the specified synthetic run, the copied Next development server routes
      passed selected UK and US storefront values to the local Channel3 mock
      using the unchanged HTTPS adapter, and returned generic 503 responses for
      two modeled provider failures.
    reason: >-
      The actual Next dev/webpack HTTP runtime ran a source-matched route graph
      in a loopback-only network namespace. A Postman proxy intercepted the
      default Channel3 HTTPS hostname using its temporary CA; the app source and
      HTTPS guard were not changed. The proxy is a stand-in, not Channel3.
    verification: >-
      On 2026-11-06, the Postman collection passed seven requests and seven
      assertions for GB/GBP and US/USD search/catalog, invalid storefronts and
      oversized search. Direct Next HTTP requests also checked configured
      DE/GBP/de defaults, malformed JSON, duplicate storefront, untrusted
      origin, and search/catalog synthetic provider failures. The proxy logged
      six HTTP 200 and two modeled HTTP 501 provider responses, all matched to
      the mock with zero passthrough. Selected working-tree and snapshot source
      hashes matched before and after. This does not verify the complete site,
      production server, hosted deployment, browser, device, real provider or
      retailer handoff. The collection warning about missing Postman authorization
      came from deliberately masked local settings; its assertions still passed.
    source: >-
      /home/protocol-x/Downloads/paypal-channel3-next-proxy-simulation.py ;
      /home/protocol-x/Downloads/paypal-channel3-next-proxy-_r9nik0h.log
    updated_at: '2026-11-06'
