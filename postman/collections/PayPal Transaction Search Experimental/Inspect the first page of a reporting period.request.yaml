$kind: http-request
description: Local synthetic first-page fixture; never a merchant or customer report.
url: '{{baseUrl}}/v1/reporting/transactions?start_date=2026-01-01T00%3A00%3A00Z&end_date=2026-01-08T00%3A00%3A00Z&fields=transaction_info&balance_affecting_records_only=Y&page=1&page_size=100'
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Authorization
    value: Bearer synthetic-reporting-token
queryParams:
  - key: start_date
    value: '2026-01-01T00:00:00Z'
  - key: end_date
    value: '2026-01-08T00:00:00Z'
  - key: fields
    value: transaction_info
  - key: balance_affecting_records_only
    value: 'Y'
  - key: page
    value: '1'
  - key: page_size
    value: '100'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('synthetic provider returns the modeled first page', function () {
        pm.response.to.have.status(200);
        const body = pm.response.json();
        pm.expect(body.transaction_details).to.be.an('array').with.lengthOf(2);
      });
settings: {}
examples: ./.resources/Inspect the first page of a reporting period.resources/examples
order: 1000
