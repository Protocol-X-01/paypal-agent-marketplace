$kind: http-request
name: POST cancel
order: 7000
url: "{{baseUrl}}/api/auth/native/cancel"
method: POST
settings:
  followRedirects: false
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Disabled native route has expected status", () => { pm.response.to.have.status(503); });
      pm.test("Native response privacy headers", () => {
        pm.expect(pm.response.headers.get("Cache-Control")).to.eql("no-store");
        pm.expect(pm.response.headers.get("Referrer-Policy")).to.eql("no-referrer");
        pm.expect(pm.response.headers.get("Content-Security-Policy")).to.include("default-src 'none'");
      });
