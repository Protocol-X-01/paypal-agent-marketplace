$kind: http-request
name: Reject unavailable PYUSD
url: '{{baseUrl}}/api/market/intraday/paypal-usd?interval=3m&days=1'
method: GET
headers:
  - key: Accept
    value: application/json
queryParams:
  - key: interval
    value: 3m
  - key: days
    value: '1'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |
      pm.test('PYUSD is unavailable', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().error.code).to.equal('unsupported_coin');
      });
order: 1000
