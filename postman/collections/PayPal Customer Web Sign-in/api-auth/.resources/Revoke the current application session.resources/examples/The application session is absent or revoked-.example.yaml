$kind: http-example
name: The application session is absent or revoked.
request:
  url: "{{baseUrl}}/api/auth/logout"
  method: POST
  headers:
    - key: Origin
      value: https://app.example.test
      disabled: false
      description: (Required) Must exactly match the configured public HTTPS origin.
  body:
    type: text
    content: ""
response:
  statusCode: 204
  statusText: No Content
  headers:
    - key: Referrer-Policy
      value: no-referrer
      disabled: false
      description: "(Required) "
    - key: Set-Cookie
      value: "__Host-paypal-markets-session=; Secure; HttpOnly; Path=/; SameSite=Lax; Max-Age=0"
      disabled: false
      description: "(Required) "
    - key: Cache-Control
      value: no-store
      disabled: false
      description: "(Required) "
    - key: Content-Type
      value: text/plain
  body:
    type: text
    content: ""
order: 1000
