$kind: http-example
name: Redirect to the fixed local account page after success or generic failure.
request:
  url: "{{baseUrl}}/api/auth/paypal/callback?code=string&state=string&error=string"
  method: GET
  queryParams:
    code: string
    state: string
    error: string
  body:
    type: text
    content: ""
response:
  statusCode: 303
  statusText: See Other
  headers:
    - key: Referrer-Policy
      value: no-referrer
      disabled: false
      description: "(Required) "
    - key: Location
      value: "https://app.example.test/dashboard?auth=failed#account"
      disabled: false
      description: "(Required) "
    - key: Cache-Control
      value: no-store
      disabled: false
      description: "(Required) "
    - key: Content-Type
      value: text/plain
  body:
    type: text
    content: ""
order: 1000
