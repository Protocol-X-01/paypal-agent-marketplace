$kind: http-example
request:
  url: "{{baseUrl}}/v1/search"
  method: POST
  headers:
    - key: x-api-key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "query": "noise-cancelling headphones",
        "limit": 5,
        "config": {
          "mode": "default",
          "country": "US",
          "currency": "USD"
        }
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity (WebDAV) (RFC 4918)
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "key_0": 8387
      }
order: 2000
