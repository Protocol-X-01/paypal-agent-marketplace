$kind: http-example
request:
  url: "{{baseUrl}}/v1/lookup"
  method: POST
  headers:
    - key: x-api-key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "url": "https://www.example.com/products/sample-item",
        "max_staleness_hours": 3
      }
response:
  statusCode: 504
  statusText: Gateway Timeout
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 3000
