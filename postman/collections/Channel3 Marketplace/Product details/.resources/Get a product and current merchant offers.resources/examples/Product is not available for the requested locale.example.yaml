$kind: http-example
request:
  url: "{{baseUrl}}/v1/products/:product_id"
  method: GET
  headers:
    - key: x-api-key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    - key: product_id
      value: string
      disabled: false
      description: (Required) Channel3 product ID returned by search or browse
  body:
    type: text
    content: ""
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 2000
