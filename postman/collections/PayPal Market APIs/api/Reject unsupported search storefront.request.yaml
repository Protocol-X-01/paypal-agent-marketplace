$kind: http-request
description: Reject an unsupported storefront before provider work.
url: '{{baseUrl}}/api/marketplace/search'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"query":"headphones","storefront":"FR"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("rejects an unsupported search storefront", function () {
        pm.response.to.have.status(400);
        pm.expect(pm.response.headers.get("Cache-Control")).to.eql("no-store");
        pm.expect(pm.response.json().error).to.be.a("string");
      });
settings: {}
order: 2400
