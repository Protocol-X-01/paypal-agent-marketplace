$kind: http-request
description: Sends a generated JSON body above the 8 KiB limit and asserts the 413 response. The request is rejected before Channel3 search or provider rate limiting.
url: '{{baseUrl}}/api/marketplace/search'
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "query": "headphones"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      const oversized = JSON.stringify({
        query: "headphones",
        padding: "x".repeat(8200)
      });
      pm.request.body.update({ mode: "raw", raw: oversized });
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("oversized search bodies are rejected before provider work", function () {
        pm.response.to.have.status(413);
        pm.expect(pm.response.json().error).to.eql("Search request body exceeds 8 KiB.");
      });
settings: {}
order: 3000
