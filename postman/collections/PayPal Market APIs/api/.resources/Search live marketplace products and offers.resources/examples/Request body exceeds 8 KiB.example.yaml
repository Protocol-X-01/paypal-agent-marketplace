$kind: http-example
request:
  url: "{{baseUrl}}/api/marketplace/search"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "query": "headphones",
        "padding": ""
      }
response:
  statusCode: 413
  statusText: Content Too Large
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": "Search request body exceeds 8 KiB."
      }
order: 7000
