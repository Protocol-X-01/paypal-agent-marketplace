$kind: http-example
request:
  url: "{{baseUrl}}/api/marketplace/search"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "query": "headphones",
        "limit": 6
      }
response:
  statusCode: 408
  statusText: Request Timeout
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": "Search request body timed out."
      }
order: 5000
