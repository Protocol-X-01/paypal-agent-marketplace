$kind: http-request
description: Local Expo-web preflight check. This origin is development-only unless
  explicitly configured in production.
url: '{{baseUrl}}/api/market/candles/:coinId'
method: OPTIONS
pathVariables:
- key: coinId
  value: bitcoin
settings: {}
order: 7000
headers:
- key: Origin
  value: http://localhost:8081
- key: Access-Control-Request-Method
  value: GET
scripts:
- type: afterResponse
  language: text/javascript
  code: "pm.test(\"Allowed local Expo origin can read candles\", function () {\n \
    \ pm.response.to.have.status(204);\n  pm.expect(pm.response.headers.get(\"Access-Control-Allow-Origin\"\
    )).to.eql(\"http://localhost:8081\");\n});"
