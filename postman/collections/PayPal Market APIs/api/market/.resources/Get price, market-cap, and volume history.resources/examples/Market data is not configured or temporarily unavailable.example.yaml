$kind: http-example
request:
  url: "{{baseUrl}}/api/market/chart/:coinId?days=7"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    days: "7"
  pathVariables:
    - key: coinId
      value: solana
      disabled: false
      description: (Required) CoinGecko identifier from the tracked watchlist
  body:
    type: text
    content: ""
response:
  statusCode: 503
  statusText: Service Unavailable
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "market_data_unavailable",
          "message": "Market data is temporarily unavailable. Please try again shortly."
        }
      }
order: 4000
