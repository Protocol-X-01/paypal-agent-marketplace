$kind: http-request
description: Retrieves fresh product details by a Channel3 product ID before retailer handoff. A 404 with code PRODUCT_UNAVAILABLE confirms no result or storefront offer; clients must not treat it as a missing route. The response is not cached; Channel3 availability is not a retailer guarantee.
url: '{{baseUrl}}/api/marketplace/products/:productId?storefront=US'
method: GET
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: productId
    value: 'SET_FROM_CHANNEL3_SEARCH'
settings: {}
order: 5000
